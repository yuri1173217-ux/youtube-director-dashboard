<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 떡상 탑10 + 추천 3개</title>
<style>
:root{--bg:#0f1218;--card:#181d27;--line:#262d3b;--tx:#e8ecf3;--mut:#8f9bb0;--acc:#ffd600;--hot:#ff7a45;--ok:#4cc38a;--warn:#ff5d5d;--x:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px}
select,a.btn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;text-decoration:none}
h2{font-size:17px;margin:22px 0 10px;color:var(--acc)}
.rec{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:14px;margin-bottom:12px}
.rec .t{font-size:17px;font-weight:700}
.tag{display:inline-block;background:#262d3b;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mut);margin-right:6px}
.rec dl{margin:10px 0 0;display:grid;grid-template-columns:90px 1fr;gap:6px 10px}
.rec dt{color:var(--mut);font-size:13px}
.rec dd{margin:0}
.rec ol{margin:0;padding-left:18px}
.risk{color:var(--warn)}
.row{display:grid;grid-template-columns:34px 120px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.rank{font-size:20px;font-weight:800;color:var(--acc);text-align:center}
.row img{width:120px;height:auto;aspect-ratio:9/16;object-fit:cover;border-radius:8px;background:#000}
.row .tt{font-weight:600;margin-bottom:4px;word-break:break-all}
.meta{color:var(--mut);font-size:13px}
.big{color:var(--hot);font-weight:700}
.links a{color:#7cc4ff;margin-right:12px;font-size:13px}
.note{color:var(--mut);font-size:12.5px;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.empty{color:var(--mut);padding:30px;text-align:center}
/* 플랫폼 탭 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line);margin:12px 0 14px}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:8px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--acc);border-color:var(--acc);color:#141414;font-weight:800}
.pane{display:none}
.pane.on{display:block}
.signal{background:#151b26;border-left:4px solid var(--x);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px;color:var(--tx)}
.signal b{color:var(--acc)}
.srow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px}
.srow .h{display:flex;gap:9px;align-items:baseline}
.srow .rank{min-width:24px;font-size:14px;text-align:left}
.srow .who{font-weight:700;font-size:14px}
.srow .tt{font-weight:600;word-break:break-all;margin-top:3px}
.srow .meta{font-size:12.5px;margin-top:3px}
.srow .links a{font-size:12.5px;text-decoration:none}
.tt-stats{color:var(--hot);font-weight:700}
.creators{color:var(--mut);font-size:12.5px}
@media(max-width:560px){.row{grid-template-columns:28px 90px 1fr}.row img{width:90px}.rec dl{grid-template-columns:70px 1fr}}
</style>
<!-- 🔒 페이지 잠금 (index.html · morning.html 공통 / localStorage 공유 키) -->
<style>
  html.yd-locked body { visibility: hidden; }
  html.yd-locked #yd-gate { visibility: visible; }
  #yd-gate {
    position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 500px at 50% -180px, #16203a 0%, #0b0f19 60%) no-repeat, #0b0f19;
    color: #f1f5f9; padding: 24px 18px; visibility: visible;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #yd-gate .yd-card {
    width: 100%; max-width: 330px; background: #141b2d; border: 1px solid #25314d;
    border-radius: 18px; padding: 26px 22px 22px; text-align: center;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  #yd-gate .yd-icon { font-size: 26px; line-height: 1; }
  #yd-gate .yd-title { font-size: 16px; font-weight: 800; margin-top: 10px; letter-spacing: -0.3px; }
  #yd-gate .yd-sub { font-size: 12.5px; color: #94a3b8; margin-top: 5px; }
  #yd-gate input {
    width: 100%; margin-top: 18px; background: #0b0f19; border: 1.5px solid #25314d;
    border-radius: 12px; padding: 13px 14px; color: #f1f5f9; font-size: 20px; font-weight: 700;
    letter-spacing: 6px; text-align: center;
  }
  #yd-gate input::placeholder { color: #475569; letter-spacing: 4px; }
  #yd-gate input:focus { outline: none; border-color: rgba(251, 191, 36, 0.7); }
  #yd-gate button {
    width: 100%; margin-top: 10px; background: rgba(251, 191, 36, 0.14); border: 1.5px solid rgba(251, 191, 36, 0.45);
    color: #fbbf24; font-size: 14px; font-weight: 800; border-radius: 12px; padding: 12px; cursor: pointer;
    font-family: inherit;
  }
  #yd-gate button:active { transform: scale(0.98); }
  #yd-gate .yd-msg { min-height: 16px; margin-top: 9px; font-size: 12px; font-weight: 700; color: #f87171; }
</style>
<script>
(function () {
  var KEY = 'yd-unlock-v1', VAL = 'ok';
  var HASH = '5d1a8659abe2b8e0ed3b158d746fe06bd5bd12f4520ff900a835cdb76ae75ef5';
  var PLAIN = '3188';
  function unlocked() { try { return localStorage.getItem(KEY) === VAL; } catch (e) { return false; } }
  if (unlocked()) return;
  document.documentElement.classList.add('yd-locked');
  function sha256(s) {
    if (!(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder)) return Promise.resolve(null);
    try {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      }).catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }
  function mount() {
    var wrap = document.createElement('div');
    wrap.id = 'yd-gate';
    wrap.innerHTML = '<div class="yd-card">' +
      '<div class="yd-icon">🔒</div>' +
      '<div class="yd-title">틴이님 전용 대시보드</div>' +
      '<div class="yd-sub">비밀번호 4자리를 입력하세요</div>' +
      '<input id="yd-pass" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" placeholder="····" aria-label="비밀번호">' +
      '<button id="yd-go" type="button">열기</button>' +
      '<div class="yd-msg" id="yd-msg" role="alert"></div>' +
      '</div>';
    document.body.appendChild(wrap);
    var inp = document.getElementById('yd-pass');
    var msg = document.getElementById('yd-msg');
    var card = wrap.querySelector('.yd-card');
    function shake() {
      if (!card || !card.animate) return;
      card.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 220 });
    }
    function fail() {
      msg.textContent = '비밀번호가 맞지 않습니다';
      inp.value = '';
      inp.focus();
      shake();
    }
    function ok() {
      try { localStorage.setItem(KEY, VAL); } catch (e) {}
      wrap.remove();
      document.documentElement.classList.remove('yd-locked');
    }
    function submit() {
      var v = inp.value.trim();
      if (!v) { msg.textContent = '비밀번호를 입력해 주세요'; return; }
      sha256(v).then(function (h) { if (h ? h === HASH : v === PLAIN) { ok(); } else { fail(); } });
    }
    document.getElementById('yd-go').addEventListener('click', submit);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    inp.addEventListener('input', function () { msg.textContent = ''; });
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', mount); } else { mount(); }
})();
</script>

</head>
<body>
<div class="wrap">
<h1>아침 떡상 탑10 + 추천 3개</h1>

<nav class="tabs" role="tablist">
  <button class="tab on" data-p="yt" role="tab" aria-selected="true">📺 유튜브 (28분야)</button>
  <button class="tab" data-p="th" role="tab" aria-selected="false">🧵 스레드 (0원)</button>
  <button class="tab" data-p="tt" role="tab" aria-selected="false">🎵 틱톡 (1~3위)</button>
</nav>

<div class="bar">
<select id="dates" aria-label="날짜 선택"></select>
<a class="btn" href="index.html">총감독 대시보드로</a>
</div>

<section class="pane on" id="p-yt">
  <div class="sub" id="sub">불러오는 중...</div>
  <div id="out"><div class="empty">불러오는 중...</div></div>
  <div class="note" id="note"></div>
</section>

<section class="pane" id="p-th">
  <div class="signal" id="th-signal">수집원: <b>threads.com 공개 검색</b> · 로그인 없이 첫 화면</div>
  <div id="th-out"><div class="empty">불러오는 중...</div></div>
  <div class="note" id="th-note"></div>
</section>

<section class="pane" id="p-tt">
  <div class="signal" id="tt-signal">수집원: <b>TikTok Creative Center (KR · 최근 7일)</b> · 로그아웃 상태 · 순위 1~3위만 무료</div>
  <div id="tt-out"><div class="empty">불러오는 중...</div></div>
  <div class="note" id="tt-note"></div>
</section>
</div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'text') e.textContent = v; else e.setAttribute(k, v); }
  for (const c of [].concat(kids)) if (c) e.append(c);
  return e;
};
const safeUrl = u => (typeof u === 'string' && /^https:\/\/(www\.)?(youtube\.com|youtu\.be|i\.ytimg\.com|threads\.com|www\.threads\.com|tiktok\.com|www\.tiktok\.com)\//.test(u)) ? u : '#';
const fmt = n => (n == null ? '-' : Number(n).toLocaleString('ko-KR'));
const num = (v, label) => label || fmt(v);

/* ---------------- 유튜브 (기존 그대로) ---------------- */
function render(d) {
  const out = $('#out'); out.replaceChildren();
  $('#sub').textContent = d.date + ' 기준 / 최근 7일 / 주제 지정 없이 28개 분야 / 만든 시각 ' + (d.generated || '-');
  out.append(el('h2', {text: '오늘의 추천 3개'}));
  (d.recommendations || []).forEach((r, i) => {
    const st = el('ol'); (r.structure || []).forEach(s => st.append(el('li', {text: s})));
    const dl = el('dl');
    const add = (k, v, cls) => { if (v) { dl.append(el('dt', {text: k}), el('dd', cls ? {class: cls, text: v} : {text: v})); } };
    add('소재', r.material); add('첫 3초', r.hook3s);
    if ((r.structure || []).length) { dl.append(el('dt', {text: '구성 4단'}), el('dd', {}, st)); }
    add('왜 추천', r.why); add('위험', r.risks, 'risk'); add('확인할 것', r.check);
    out.append(el('div', {class: 'rec'}, [
      el('div', {}, [el('span', {class: 'tag', text: '추천 ' + (i + 1)}), el('span', {class: 'tag', text: r.topic || ''})]),
      el('div', {class: 't', text: r.title || r.topic || ''}), dl
    ]));
  });
  out.append(el('h2', {text: '탑10 (구독자 대비 조회수 배수 순)'}));
  (d.top10 || []).forEach(v => {
    const img = el('img', {src: safeUrl(v.thumb), alt: '', loading: 'lazy'});
    const med = v.x_median ? ' / 이 채널 평소 대비 ' + v.x_median + '배' : '';
    const info = el('div', {}, [
      el('div', {class: 'tt', text: v.title}),
      el('div', {class: 'meta'}, [el('span', {class: 'tag', text: v.kw || ''}), document.createTextNode('조회 ' + fmt(v.views) + ' / 구독 ' + fmt(v.subs) + ' / ' + (v.sec || '-') + '초 / ' + (v.pub || ''))]),
      el('div', {class: 'meta'}, [el('span', {class: 'big', text: '구독자의 ' + fmt(v.ratio) + '배'}), document.createTextNode(med)]),
      el('div', {class: 'meta', text: '대표 채널: ' + (v.channel || '-') + ' (구독 ' + fmt(v.subs) + ')'}),
      el('div', {class: 'links'}, [el('a', {href: safeUrl(v.url), target: '_blank', rel: 'noopener', text: '영상 보기'}), el('a', {href: safeUrl(v.channel_url), target: '_blank', rel: 'noopener', text: '채널 보기'})])
    ]);
    out.append(el('div', {class: 'row'}, [el('div', {class: 'rank', text: v.rank}), img, info]));
  });
  $('#note').textContent = d.note || '숫자는 구독자 수백 명 채널 기준이라 영상과 댓글로 진위를 확인해야 합니다. 제목과 구성은 참고용이고 대본과 화면은 새로 만들어야 합니다.';
}

/* ---------------- 스레드 ---------------- */
function renderThreads(d) {
  const out = $('#th-out'); out.replaceChildren();
  const p = d && d.platforms && d.platforms.threads;
  if (!p || !(p.items || []).length) {
    $('#th-signal').innerHTML = '수집원: <b>threads.com 공개 검색</b> · 로그인 없이 첫 화면';
    out.append(el('div', {class: 'empty', text: '이 날짜의 스레드 수집 데이터가 없습니다. 수집기가 아침 7시 30분에 돌면 채워집니다.'}));
    $('#th-note').textContent = '';
    return;
  }
  $('#th-signal').innerHTML = '';
  $('#th-signal').append(
    el('b', {text: 'threads.com 공개 검색'}),
    document.createTextNode(' · 검색어 "' + (p.query || '') + '" · 무료 ' + (p.items || []).length + '건' + (p.collected_at ? ' · 수집 ' + p.collected_at.slice(0, 16).replace('T', ' ') : ''))
  );
  (p.items || []).forEach(it => {
    const rest = [];
    if (it.replies != null) rest.push('답글 ' + fmt(it.replies));
    if (it.reposts != null) rest.push('리포스트 ' + fmt(it.reposts));
    if (it.shares != null) rest.push('공유 ' + fmt(it.shares));
    const stats = el('div', {class: 'meta'}, [
      el('span', {class: 'tt-stats', text: '좋아요 ' + num(it.likes, it.likes_label)}),
      document.createTextNode(rest.length ? ' · ' + rest.join(' · ') : '')
    ]);
    out.append(el('div', {class: 'srow'}, [
      el('div', {class: 'h'}, [el('span', {class: 'rank', text: '#' + (it.rank || '')}), el('span', {class: 'who', text: '@' + (it.author || '')}), el('span', {class: 'meta', text: it.date || ''})]),
      el('div', {class: 'tt', text: it.text || ''}),
      stats,
      el('div', {class: 'links'}, [el('a', {href: safeUrl(it.url), target: '_blank', rel: 'noopener', text: '원문 열기 ↗'})])
    ]));
  });
  $('#th-note').textContent = p.note || '';
}

/* ---------------- 틱톡 ---------------- */
function renderTiktok(d) {
  const out = $('#tt-out'); out.replaceChildren();
  const p = d && d.platforms && d.platforms.tiktok;
  if (!p || !(p.items || []).length) {
    $('#tt-signal').innerHTML = '수집원: <b>TikTok Creative Center (KR · 최근 7일)</b> · 로그아웃 상태 · 순위 1~3위만 무료';
    out.append(el('div', {class: 'empty', text: '이 날짜의 틱톡 수집 데이터가 없습니다. 수집기가 아침 7시 30분에 돌면 채워집니다.'}));
    $('#tt-note').textContent = '';
    return;
  }
  $('#tt-signal').innerHTML = '';
  $('#tt-signal').append(
    el('b', {text: 'TikTok Creative Center (KR · 최근 7일)'}),
    document.createTextNode(' · 로그아웃 · ' + (p.collected_at ? '수집 ' + p.collected_at.slice(0, 16).replace('T', ' ') : ''))
  );
  (p.items || []).forEach(it => {
    out.append(el('div', {class: 'srow'}, [
      el('div', {class: 'h'}, [el('span', {class: 'rank', text: it.rank}), el('span', {class: 'tt', style: 'margin-top:0;font-size:16px', text: it.tag || ''})]),
      el('div', {class: 'meta'}, [document.createTextNode('게시물 '), el('span', {class: 'tt-stats', text: num(it.posts, it.posts_label)}), document.createTextNode(' · 조회 '), el('span', {class: 'tt-stats', text: num(it.views, it.views_label)})]),
      el('div', {class: 'creators', text: '업종: ' + ((it.industries || []).join(' / ') || '-')}),
      el('div', {class: 'creators', text: '상위 크리에이터: ' + ((it.creators || []).join(' · ') || '-')}),
      el('div', {class: 'links'}, [el('a', {href: safeUrl(it.url), target: '_blank', rel: 'noopener', text: '태그 열기 ↗'})])
    ]));
  });
  $('#tt-note').textContent = p.note || '';
}

/* ---------------- 로딩 ---------------- */
async function getJson(url) {
  const r = await fetch(url + '?t=' + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadYt(date) {
  try { render(await getJson('morning/' + date + '.json')); }
  catch (e) {
    $('#out').replaceChildren(el('div', {class: 'empty', text: '이 날짜의 유튜브 리포트가 없습니다 (' + e.message + ')'}));
    $('#sub').textContent = date + ' · 유튜브 리포트 없음';
    $('#note').textContent = '';
  }
}
async function loadSns(date) {
  let d = null;
  try { d = await getJson('morning/sns-' + date + '.json'); } catch (e) { d = null; }
  renderThreads(d);
  renderTiktok(d);
}
(async () => {
  let ytDates = [], snsDates = [];
  try { ytDates = (await getJson('morning/index.json')).dates || []; } catch (e) {}
  try { snsDates = (await getJson('morning/sns-index.json')).dates || []; } catch (e) {}
  const dates = Array.from(new Set([].concat(ytDates, snsDates))).sort().reverse();
  const sel = $('#dates');
  dates.forEach(x => sel.append(el('option', {value: x, text: x})));
  if (!dates.length) {
    $('#out').replaceChildren(el('div', {class: 'empty', text: '아직 리포트가 없습니다. 내일 아침 7시 30분에 첫 리포트가 올라옵니다.'}));
    return;
  }
  sel.value = dates[0];
  sel.onchange = () => { loadYt(sel.value); loadSns(sel.value); };
  loadYt(dates[0]);
  loadSns(dates[0]);
})();

/* ---------------- 탭 ---------------- */
document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-selected', 'false'); });
    document.querySelectorAll('.pane').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    t.setAttribute('aria-selected', 'true');
    var p = document.getElementById('p-' + t.dataset.p);
    if (p) p.classList.add('on');
  });
});
</script>
</body>
</html>
